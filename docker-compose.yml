services:
  # Optional local MongoDB for development when no Atlas cluster is available.
  # Use MONGODB_URI below pointing at this service for a fully local stack.
  mongodb:
    image: mongo:7
    container_name: donate-bharat-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: initializes the single-node replica set so transactions work.
  # Idempotent — re-running on restart is a no-op.
  mongo-init:
    image: mongo:7
    container_name: donate-bharat-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongodb
      - --quiet
      - --eval
      - "try { rs.status(); print('replica set already initialized'); } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}); print('replica set initialized'); }"

  api:
    build: ./backend
    container_name: donate-bharat-api
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/donate_bharat
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./frontend
    container_name: donate-bharat-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  uploads:
  mongo-data:
